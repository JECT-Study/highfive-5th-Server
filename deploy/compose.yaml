# dev 서버(EC2)용. CodeDeploy가 이 폴더를 /home/ubuntu/app에 풀고 scripts/deploy.sh가 실행한다
# - image.env: CI가 배포할 때 만든다 (ECR_REGISTRY, IMAGE_TAG)
# - /home/ubuntu/config/.env: 서버에만 있는 비밀값 (deploy/.env.example 참고, 레포에 없음)
# 로컬 개발용은 루트의 compose.yaml
name: highfive

services:
  app:
    image: ${ECR_REGISTRY}/highfive-api:${IMAGE_TAG}
    env_file: /home/ubuntu/config/.env
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_URL: jdbc:mysql://mysql:3306/highfive?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
      REDIS_HOST: redis
      # 서버 메모리의 절반까지 힙으로 쓴다. 인스턴스를 키우면 자동으로 따라 늘어난다
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=50
    ports:
      - "127.0.0.1:8080:8080" # 외부에는 Nginx만 노출
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: highfive
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      # 첫 실행의 초기화 중에는 TCP가 닫혀 있어서, 초기화가 끝난 뒤에야 healthy가 된다
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 5s
      timeout: 3s
      retries: 30
    ports:
      - "127.0.0.1:3306:3306" # SSM 포트 포워딩 접속용, 외부 비공개
    volumes:
      - mysql-data:/var/lib/mysql
    restart: unless-stopped

  redis:
    image: redis:7
    command: ["redis-server", "--appendonly", "yes"] # 재시작해도 리프레시 토큰 유지
    volumes:
      - redis-data:/data
    restart: unless-stopped

volumes:
  mysql-data:
  redis-data:
