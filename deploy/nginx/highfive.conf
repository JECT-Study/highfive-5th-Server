# dev 서버 Nginx 설정. setup.sh가 /etc/nginx/conf.d/highfive.conf로 복사한다
# 80번으로 받아 앱(127.0.0.1:8080)으로 넘긴다. HTTPS는 certbot이 이 파일에 443 서버와 리다이렉트를 추가한다

# WebSocket 업그레이드 요청이면 Connection: upgrade, 아니면 close
map $http_upgrade $connection_upgrade {
  default upgrade;
  ""      close;
}

upstream highfive_app {
  server 127.0.0.1:8080;
  keepalive 16;
}

server {
  listen 80 default_server;
  listen [::]:80 default_server;
  # 도메인을 연결하면 setup.sh가 _ 를 도메인으로 바꾼다
  server_name _;

  server_tokens off;
  # 이미지는 presigned URL로 S3에 직접 올리므로 본문이 클 일이 없다
  client_max_body_size 10m;

  # 헬스 체크(/actuator/health)는 서버 안에서 8080으로 직접 호출한다. 밖에는 열지 않는다
  location /actuator/ {
    return 404;
  }

  location / {
    proxy_pass http://highfive_app;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # 앱이 forward-headers-strategy: native라서 http/https 구분을 이 헤더로 안다
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;

    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
  }
}
