plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.2'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'checkstyle'
	id 'com.diffplug.spotless' version '8.11.0'
}

group = 'com.ject'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	// Boot BOM에 없어 버전을 직접 지정. 3.2.0은 Boot 4.1.2 기준으로 빌드된 버전
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.2.0'
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	runtimeOnly 'com.mysql:mysql-connector-j'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.testcontainers:testcontainers-mysql'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'com.h2database:h2'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
	useJUnitPlatform()
}

// Google Java Style
spotless {
	java {
		target 'src/*/java/**/*.java'
		// import 정리·순서, 공백, 마지막 줄바꿈까지 google-java-format이 처리한다
		// IntelliJ google-java-format 플러그인과 같은 버전으로 맞춘다
		googleJavaFormat('1.28.0')
	}
}

checkstyle {
	// Java 17에서 돌아가는 마지막 버전 (13.0.0부터 Java 21 필요). IntelliJ CheckStyle-IDEA도 같은 버전으로 맞춘다
	toolVersion = '12.3.1'
	// Checkstyle jar에 들어 있는 google_checks.xml을 그대로 쓴다
	config = resources.text.fromArchiveEntry(
		configurations.checkstyle.filter { it.name == "checkstyle-${toolVersion}.jar" },
		'google_checks.xml')
	// google_checks.xml의 SuppressionFilter가 읽는 파일. Javadoc 규칙을 여기서 끈다
	configProperties = [
		'org.checkstyle.google.suppressionfilter.config':
			file('config/checkstyle/checkstyle-suppressions.xml').absolutePath
	]
	// google_checks.xml은 severity가 warning이라 경고 하나라도 있으면 실패하게 한다
	maxWarnings = 0
}
