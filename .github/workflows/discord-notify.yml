# PR 생성·머지, develop CI 실패를 Discord로 알린다
# webhook URL은 레포 Settings → Secrets → Actions의 DISCORD_WEBHOOK_URL (없으면 알림만 건너뜀)
name: Discord 알림

on:
  pull_request:
    types: [opened, reopened, ready_for_review, closed]
    branches: [develop, main]
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [develop]

permissions:
  contents: read

jobs:
  notify:
    # PR: draft가 아닌 PR이 열렸을 때와 머지됐을 때만 (머지 없이 닫힌 PR은 제외)
    # CI: develop push로 돈 CI가 실패했을 때만
    if: >-
      (github.event_name == 'pull_request' && (
        (github.event.action == 'closed' && github.event.pull_request.merged) ||
        (github.event.action != 'closed' && !github.event.pull_request.draft)))
      || (github.event_name == 'workflow_run' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.conclusion == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v7
        with:
          # 머지된 PR은 refs/pull/N/merge가 없어질 수 있어서 closed 이벤트는 base 브랜치를 받는다
          ref: ${{ github.event.action == 'closed' && github.event.pull_request.base.ref || '' }}
          sparse-checkout: .github/scripts

      # PR 제목 등 사용자가 입력한 값은 스크립트에 직접 넣지 않고 환경변수로만 넘긴다
      - name: PR 알림
        if: github.event_name == 'pull_request'
        env:
          KIND: ${{ github.event.action == 'closed' && 'pr_merged' || 'pr_opened' }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
        run: bash .github/scripts/discord-notify.sh

      - name: CI 실패 알림
        if: github.event_name == 'workflow_run'
        env:
          KIND: ci_failed
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          COMMIT_MESSAGE: ${{ github.event.workflow_run.head_commit.message }}
          ACTOR: ${{ github.event.workflow_run.actor.login }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: bash .github/scripts/discord-notify.sh
