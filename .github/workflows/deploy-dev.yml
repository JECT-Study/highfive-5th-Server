# develop의 CI(./gradlew check)가 성공한 커밋만 dev 서버(EC2)에 배포한다
# 이미지 빌드 → ECR push(태그 = 커밋 SHA) → 배포 묶음 S3 업로드 → CodeDeploy 배포 → 완료까지 대기
# 배포 대상은 CI가 돌았던 커밋(workflow_run.head_sha)이다. 그 사이 새로 머지된 커밋은 섞이지 않는다
# 배포 시작 시점에 develop 맨 끝이 아닌 커밋은 건너뛴다 (더 새 커밋의 CI가 끝나면 그쪽이 배포된다)
# AWS 접속은 액세스 키 없이 GitHub OIDC로 역할(highfive-github-actions)을 받는다
# 레포 변수(Settings → Secrets and variables → Actions → Variables): AWS_ROLE_ARN, ECR_REPOSITORY, DEPLOY_BUCKET
# AWS_ROLE_ARN이 없으면 배포를 건너뛴다
# 수동 실행(workflow_dispatch)은 CI를 거치지 않는다. develop 브랜치에서 직접 눌러 쓰는 비상용이다
name: Deploy dev

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [develop]
  workflow_dispatch:

# 배포가 겹치지 않게 한 줄로 세운다 (진행 중인 배포는 끊지 않는다)
concurrency:
  group: deploy-dev
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # OIDC 토큰 발급

env:
  AWS_REGION: ap-northeast-2
  CODEDEPLOY_APPLICATION: highfive-api
  CODEDEPLOY_GROUP: dev

jobs:
  # 배포할지 판단한다: 변수가 있고, (수동 실행이거나 develop push로 돈 CI가 성공했고 그 커밋이 develop 맨 끝일 때)
  gate:
    if: >-
      vars.AWS_ROLE_ARN != '' && (
        github.event_name == 'workflow_dispatch' ||
        (github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      deploy: ${{ steps.latest.outputs.deploy }}
    steps:
      - name: develop 맨 끝 커밋인지 확인
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          EVENT: ${{ github.event_name }}
        run: |
          if [[ "$EVENT" == "workflow_dispatch" ]]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          tip=$(gh api "repos/$GITHUB_REPOSITORY/commits/develop" --jq .sha)
          if [[ "$tip" == "$TARGET_SHA" ]]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "develop 맨 끝($tip)이 아니라서 배포를 건너뜁니다: $TARGET_SHA"
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: gate
    if: needs.gate.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
      DEPLOY_BUCKET: ${{ vars.DEPLOY_BUCKET }}
      IMAGE_TAG: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      # workflow_run은 기본 브랜치 최신 커밋을 기준으로 돌아서, CI가 검사한 커밋을 직접 받는다
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: ECR 로그인
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # ECR 태그는 변경 불가라서 같은 SHA를 다시 올리면 거부된다 (재실행 대비해 있으면 건너뜀)
      - name: 이미지 빌드·푸시
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          # 역할에 ecr:DescribeImages가 없어서, BatchGetImage 권한으로 되는 manifest 조회로 확인한다
          if docker manifest inspect "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" > /dev/null 2>&1; then
            echo "이미 있는 이미지라 푸시를 건너뜁니다: $IMAGE_TAG"
          else
            docker build -t "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" .
            docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          fi
          # 서버의 deploy.sh가 읽는 파일 (compose가 이미지 주소를 만든다)
          printf 'ECR_REGISTRY=%s\nIMAGE_TAG=%s\n' "$ECR_REGISTRY" "$IMAGE_TAG" > deploy/image.env

      - name: 배포 묶음 업로드
        run: |
          # deploy/ 폴더가 묶음의 최상위 (appspec.yml이 맨 위에 와야 한다)
          (cd deploy && zip -qr "../bundle.zip" .)
          aws s3 cp bundle.zip "s3://$DEPLOY_BUCKET/highfive-api/dev/$IMAGE_TAG.zip"

      - name: CodeDeploy 배포
        run: |
          deployment_id=$(aws deploy create-deployment \
            --application-name "$CODEDEPLOY_APPLICATION" \
            --deployment-group-name "$CODEDEPLOY_GROUP" \
            --s3-location "bucket=$DEPLOY_BUCKET,key=highfive-api/dev/$IMAGE_TAG.zip,bundleType=zip" \
            --description "$IMAGE_TAG" \
            --query deploymentId --output text)
          echo "배포 시작: $deployment_id"
          echo "### 배포 $deployment_id" >> "$GITHUB_STEP_SUMMARY"
          echo "커밋 \`$IMAGE_TAG\`" >> "$GITHUB_STEP_SUMMARY"
          # 실패하면 이 단계도 실패한다 (최대 약 30분 대기)
          aws deploy wait deployment-successful --deployment-id "$deployment_id"
          echo "배포 완료"
