# PR마다 ./gradlew check (spotlessCheck + checkstyle + test)를 실행한다
# develop push에서도 돌려서 Gradle 캐시를 채운다 (PR에서는 캐시를 읽기만 함)
name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6

      - name: Check
        run: ./gradlew check

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: build/reports/
          retention-days: 7
